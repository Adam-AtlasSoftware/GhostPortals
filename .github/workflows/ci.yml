name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p ghostportals-linux
      - uses: actions/upload-artifact@v4
        with:
          name: ghostportals-linux
          path: target/release/ghostportals-linux

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p ghostportals-windows -- -D warnings
      - run: cargo test -p ghostportals-core
      - run: cargo build --release -p ghostportals-windows
      - uses: actions/upload-artifact@v4
        with:
          name: ghostportals-windows
          path: target/release/ghostportals-windows.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      # Tags with a suffix (v0.1.0-alpha.1) are published as pre-releases.
      - run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes $flags \
            ghostportals-linux/ghostportals-linux ghostportals-windows/ghostportals-windows.exe
        env:
          GH_TOKEN: ${{ github.token }}
