[workspace]
resolver = "3"
members = [
    "crates/ghostportals-core",
    "crates/ghostportals-media",
    "crates/ghostportals-linux",
    "crates/ghostportals-windows",
    "crates/ghostportals-gui",
]

[workspace.package]
version = "0.1.0-alpha.7"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
ghostportals-core = { path = "crates/ghostportals-core" }
ghostportals-media = { path = "crates/ghostportals-media" }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
